<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thitta-Murasu | AI Scheme Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <nav class="bg-blue-900 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl font-bold tracking-tight">திட்ட முரசு (Thitta-Murasu)</span>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="{% url 'home' %}" class="hover:text-blue-300 font-medium transition">Home</a>
                    <a href="{% url 'check_eligibility' %}" class="hover:text-blue-300 font-medium transition">Check Eligibility</a>
                    <a href="{% url 'bulk_outreach' %}" class="hover:text-blue-300 font-medium transition">Bulk Outreach</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-slate-800 text-slate-400 py-6 text-center text-sm mt-auto">
        <p>Developed by Static Squad | Ideathon 2026</p>
    </footer>

</body>
</html>
